<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos</title>

    <style>

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        main {
            display: flex;
            min-height: 100vh;
        }

       

        .esquerdo {
            flex: 2;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 50px;
        }

        .barra {
            align-self: center;
            width: 220px;
        }

        .ft {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .ft img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
        }

        .barra nav {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .barra nav a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        .barra nav a:hover {
            color: #38bdf8;
            transform: translateX(8px);
        }

    
        .nome {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 25px;
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        .nome h1 {
            font-size: 3rem;
            color: #38bdf8;
        }

        .subtitulo {
            color: #94a3b8;
            font-size: 1rem;
            margin-top: -15px;
        }

        

        .projetos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
        }

        .projeto {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 20px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .projeto:hover {
            transform: translateY(-7px);
            border-color: #38bdf8;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .projeto-img {
            width: 100%;
            height: 150px;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #334155;
        }

        .projeto-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }

        .projeto:hover .projeto-img img {
            transform: scale(1.05);
        }

        .projeto h2 {
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .projeto p {
            color: #cbd5e1;
            line-height: 1.5;
            font-size: 0.9rem;
        }

        .tecnologias {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .tecnologia {
            background: #334155;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #cbd5e1;
        }

        

        .direito {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
            background: #1e293b;
            padding: 40px;
        }

        .contas {
            height: auto;
            background: transparent;
        }

        .contas nav {
            display: flex;
            gap: 15px;
        }

        .conta {
            width: 45px;
            height: 45px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #334155;
            color: white;

            text-decoration: none;

            transition: 0.3s;
        }

        .conta:hover {
            background: #38bdf8;
            transform: translateY(-5px);
        }

        .eu img {
            width: 250px;
            height: 300px;

            object-fit: cover;

            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

       

        .hobb {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px;
            gap: 10px;
        }

        .hobb button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .hobb button:hover {
            transform: translateY(-3px);
            background-color: #38bdf8;
        }

       

        @media (max-width: 900px) {

            main {
                flex-direction: column;
            }

            .esquerdo {
                padding: 30px;
            }

            .barra {
                width: 180px;
            }

            .projetos {
                grid-template-columns: 1fr;
            }

            .direito {
                flex-direction: row;
                padding: 30px;
            }

        }

    </style>
</head>
