<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        * {
            box-sizing: border-box;

            padding: 0;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }
main{
    display: flex;
    height: 100vh;

}
.esquerdo{
    flex: 2;
    display: flex;
    justify-content: start;
    align-items: center;
    padding: 50px;

}
.barra{
    align-self: center;
    width: 220px;
    
}
 .ft {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
          
        }
 .ft img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
        }
        .ft h1 {
            font-size: 1.5rem;
        }
.barra nav{
    display: flex;
    flex-direction: column;
    
    gap: 15px;
    margin-top: 30px;
}
.nome{
display: flex;
flex-direction: column;
   justify-content: center;
            gap: 20px;

            max-width: 600px;
            padding: 40px;
        }

        .nome h1 {
            font-size: 3rem;
            color: #38bdf8;
        }

        .nome h2 {
            font-size: 1rem;
            line-height: 1.7;
            font-weight: normal;
            color: #cbd5e1;
        }
 .barra nav a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        .barra nav a:hover {
            color: #38bdf8;
            transform: translateX(8px);
        }


        .direito{

            flex: 1;
            display: flex;
             flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
            background: #1e293b;
            padding: 40px;
    
        }
 .contas {
            height: auto;
            background: transparent;
        }
           .contas nav {
            display: flex;
            gap: 15px;
        }
        .conta {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #334155;
            color: white;

            text-decoration: none;

            transition: 0.3s;
        }

        .conta:hover {
            background: #38bdf8;
            transform: translateY(-5px);
        }
         .eu img {
            width: 250px;
            height: 300px;

            object-fit: cover;

            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .hobb{
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 40px;
        }
        button{
         margin: 10px;

        }
        button :hover{
transform: scale(1.2);
            background-color: red;
        }
        @media screen {
            
        }
.livros{
  
    display: flex;
    align-items: center;
    justify-content: end;
    flex-flow: row wrap;
    gap: 40px;
}

.livros img{
    height: 200px;
    box-shadow: 1px 1px 1px white
}
.atras{
    display: none;
}
    </style>
</head>
<body>

<script>

function li(){

function contra(){
let costa=window.document.querySelectorAll('.atras');
let frente=document.querySelectorall('.frente');
frente.style.transform = "rotateY(-190deg)";

costa.style.display='block'
