main{

.esquerdo{

    align-items: flex-start;

}
.barra{
    align-self: center;
    width: 220px;
    
}
 .ft {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
          
        }
 .ft img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
        }
        .ft h1 {

        }
.barra nav{
    display: flex;
    flex-direction: column;
    
    gap: 15px;
    margin-top: 30px;
}
.nome{
display: flex;
flex-direction: column;
   justify-content: center;
            gap: 20px;

            padding: 40px;
        }

        .nome h1 {
            font-size: 3rem;
            color: #38bdf8;
        }

        .nome h2 {
            font-size: 1rem;
            line-height: 1.7;
            font-weight: normal;
            color: #cbd5e1;
        }
 .barra nav a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        .barra nav a:hover {
            color: #38bdf8;
            transform: translateX(8px);
        }


        .direito{

            flex: 1;
            display: flex;
             flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
            background: #1e293b;
            padding: 40px;
    
        }
 .contas {

            background: transparent;

            gap: 15px;

        .conta {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #334155;
            color: white;

            text-decoration: none;

            transition: 0.3s;
        }

        .conta:hover {
            background: #38bdf8;

    display:flex;

    padding:20px;

    border-bottom:1px solid #334155;

}button{
    background:transparent;
    color:#cbd5e1;
    border:2px solid #334155;
    border-radius:999px;
    padding:12px 24px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:all .3s ease;
}
button:hover{
    background:#38bdf8;
    color:#0f172a;
    border-color:#38bdf8;
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(56,189,248,.35);
}
        @media screen {
            
        }
.livros{
    display: flex;
    align-items: center;
    justify-content: end;
    flex-flow: row wrap;
    gap: 40px;
}

.livro{
    width: 110px;
    height: 160px;
    position: relative;
    perspective: 1000px;
    cursor: pointer;
}

.frente,
.atras{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    transition: transform .7s ease;
}

.frente img,
.atras img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 6px;
    box-shadow: 1px 1px 8px rgba(255,255,255,.4);
}

.atras{
    transform: rotateY(180deg);
}

.livro.virado .frente{
    transform: rotateY(180deg);
}

.livro.virado .atras{
    transform: rotateY(360deg);
}
.academia{
    display:none;
    flex-direction:column;
    gap:25px;
    width:100%;
}
.cards-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}
.info-card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:15px;
    padding:18px;
    text-align:center;
    transition:.3s;
}

.info-card:hover{
    transform:translateY(-5px);
    border-color:#38bdf8;
}

.info-card h3{
    color:#38bdf8;
    margin-bottom:8px;
}
.treino-card,
.objetivos-card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:15px;
    padding:20px;
}
.treino-card h2,
.objetivos-card h2{
    color:#38bdf8;
    margin-bottom:15px;

.dia{

.titulo-dia{
    font-weight:bold;
transition: color 0.5s ease;}
.titulo-dia:hover{

.conteudo-dia{

.conteudo-dia ul{
